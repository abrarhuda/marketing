[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-ab"
version = "0.1.0"
description = "A reproducible marketing campaign A/B testing and introductory machine learning project."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Educational portfolio project" }
authors = [
    { name = "Marketing Analytics Project Contributors" },
]
dependencies = [
    "duckdb>=1.1,<2.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.13,<2.0",
    "seaborn>=0.13,<1.0",
    "statsmodels>=0.14,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
    "ipykernel>=6.29,<7.0",
    "nbclient>=0.10,<1.0",
    "nbformat>=5.10,<6.0",
]

[project.scripts]
marketing-ab-pipeline = "marketing_ab.pipeline:run"
marketing-ab-database = "marketing_ab.database:run_database"
marketing-ab-eda = "marketing_ab.eda:run_eda"
marketing-ab-statistics = "marketing_ab.statistical_testing:run_statistical_analysis"
marketing-ab-revenue = "marketing_ab.revenue_analysis:run_revenue_analysis"
marketing-ab-ml = "marketing_ab.machine_learning:run_machine_learning_pipeline"
marketing-ab-visualizations = "marketing_ab.visualizations:run_visualizations"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
